[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]   # B008 — ложное срабатывание для FastAPI

[tool.ruff.lint.isort]
known-first-party = ["app"]
