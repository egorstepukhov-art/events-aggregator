services:
  db:
    image: postgres:16
    container_name: events-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: events-web
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/events_db
      EVENTS_PROVIDER_URL: http://student-system-events-provider-web.student-system-events-provider.svc:8000
      EVENTS_PROVIDER_API_KEY: ${EVENTS_PROVIDER_API_KEY}
      SYNC_INTERVAL_HOURS: 24
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: